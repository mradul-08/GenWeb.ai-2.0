<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronHouse Gym Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004c8c;
      --secondary: #007bff;
      --accent: #ffc107;
      --bg: #ffffff;
      --surface: #f5f5f5;
      --text: #212121;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
    }
    a { color: var(--secondary); text-decoration: none; }
    a:focus, button:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    header, nav, main, aside, footer { padding: 1rem; }
    /* Layout */
    .sidebar {
      background: var(--surface);
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar nav a {
      display: block;
      padding: .75rem 1rem;
      margin: .25rem 0;
      border-radius: 4px;
    }
    .sidebar nav a:hover, .sidebar nav a.active { background: var(--primary); color: #fff; }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: .5rem;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .kpi-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .kpi-card h3 { margin: 0 0 .5rem; font-size: 1rem; color: var(--primary); }
    .kpi-card p { margin: 0; font-size: 1.5rem; font-weight: 500; }
    .chart, .table-section { background: var(--surface); border-radius: 8px; padding: 1rem; }
    canvas { max-width: 100%; height: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem; text-align: left; }
    th { background: var(--primary); color: #fff; }
    tr:nth-child(even) { background: #e9e9e9; }
    .theme-toggle {
      background: var(--secondary);
      border: none;
      color: #fff;
      padding: .5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; }
      .sidebar nav { display: flex; }
      .sidebar nav a { flex: 1; text-align: center; }
      .content { padding: .5rem; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <h2 style="margin:0 0 1rem;font-size:1.25rem;color:var(--primary);">IronHouse</h2>
    <nav aria-label="Main navigation">
      <a href="#" class="active">Dashboard</a>
      <a href="#">Members</a>
      <a href="#">Revenue</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <div class="content" id="main">
    <header class="top-bar">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme">Toggle Theme</button>
    </header>

    <section class="kpi-grid" id="kpis">
      <article class="kpi-card">
        <h3>Total Members</h3>
        <p>1,240</p>
      </article>
      <article class="kpi-card">
        <h3>Monthly Revenue</h3>
        <p>$42,300</p>
      </article>
      <article class="kpi-card">
        <h3>Today's Check‑ins</h3>
        <p>87</p>
      </article>
    </section>

    <section class="chart" id="attendance">
      <h3 style="margin-top:0;color:var(--primary);">Weekly Attendance</h3>
      <canvas id="attendanceChart" aria-label="Bar chart showing attendance per day of the week"></canvas>
    </section>

    <section class="table-section" id="signups">
      <h3 style="margin-top:0;color:var(--primary);">Recent Sign‑ups</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Plan</th>
            <th>Joined</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Alex Rivera</td><td>Premium</td><td>Nov 1, 2026</td></tr>
          <tr><td>Samantha Lee</td><td>Standard</td><td>Oct 30, 2026</td></tr>
          <tr><td>Mohammed Khan</td><td>Premium</td><td>Oct 28, 2026</td></tr>
          <tr><td>Emily Chen</td><td>Standard</td><td>Oct 27, 2026</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Theme toggle
    const toggleBtn = document.getElementById('themeToggle');
    const root = document.documentElement;
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') root.dataset.theme = 'dark';
    toggleBtn.addEventListener('click', () => {
      if (root.dataset.theme === 'dark') {
        root.dataset.theme = '';
        localStorage.setItem('theme', 'light');
      } else {
        root.dataset.theme = 'dark';
        localStorage.setItem('theme', 'dark');
      }
    });

    // Attendance chart
    const ctx = document.getElementById('attendanceChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets: [{
          label: 'Check‑ins',
          data: [65, 78, 54, 89, 70, 45, 60],
          backgroundColor: getComputedStyle(root).getPropertyValue('--secondary').trim(),
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { display: false } },
          x: { grid: { display: false } }
        }
      }
    });
  </script>
</body>
</html>
